services:
  tests:
    build: .
    volumes:
      - .:/app
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
    command: bash /app/scripts/run_tests_with_allure.sh

  allure-ui:
    image: nginx:alpine
    depends_on:
      - tests
    ports:
      - "5252:80"
    volumes:
      - ./allure-report:/usr/share/nginx/html:ro
      - ./docker/nginx/allure.conf:/etc/nginx/conf.d/default.conf:ro
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /usr/share/nginx/html/index.html ]; then
          echo "Allure report was not found: /usr/share/nginx/html/index.html";
          echo "Run tests first: bash scripts/run_docker_tests.sh";
          exit 1;
        fi;
        exec nginx -g 'daemon off;'
    profiles:
      - report
